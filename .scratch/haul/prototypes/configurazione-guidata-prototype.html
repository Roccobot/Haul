  return h('div', { class: 'win va' }, titlebar('Configura Haul'),
    h('div', { class: 'body' }, nav,
      h('main', {}, h('div', { class: 'content stack' }, h('h1', {}, LEAD[cur.id]), stepBody(cur.id)),
        h('footer', {},
          S.step > 0 ? h('button', { class: 'btn', on: { click: () => go(-1) } }, 'Indietro') : null,
          h('span', { class: 'spacer' }),
          cur.skip ? h('button', { class: 'btn link', on: { click: () => go(1) } }, 'Salta') : null,
          h('button', { class: 'btn primary', disabled: !canNext(), on: { click: () => last ? reset() : go(1) } }, last ? 'Apri Haul' : 'Continua')))));
}

// ── Variant B ──
function VariantB() {
  if (!S.path) S.path = 'zero';
  const imp = S.path === 'import';
  const seg = h('div', { class: 'seg', role: 'tablist' },
    h('button', { class: !imp ? 'on' : '', on: { click: () => { S.path = 'zero'; render(); } } }, 'Parti da zero'),
    h('button', { class: imp ? 'on' : '', on: { click: () => { S.path = 'import'; render(); } } }, 'Importa config.json'));
  const sec = (title, body) => h('section', {}, h('h3', {}, title), body);
  return h('div', { class: 'win vb' }, titlebar('Benvenuto in Haul'),
    h('div', { class: 'head' },
      h('h1', {}, 'Tutto è già pronto. Controlla e comincia.'),
      h('p', { class: 'muted' }, 'Haul ha scelto i valori più comuni. Cambia solo quello che vuoi: il resto è nelle impostazioni.'),
      seg,
      h('div', { class: 'strip' }, h('span', { 'data-gdl-text': '' }, gdlText()), h('div', { class: 'progress' }, h('i', { 'data-gdl-bar': '', style: 'width:' + S.gdl + '%' })))),
    imp ? sec('Configurazione', stepBody('file')) : null,
    imp ? sec('Resoconto', stepBody('report')) : sec('Cartella', stepBody('folder')),
    sec('Notifiche', stepBody('notify')),
    h('div', { class: 'foot' },
      h('span', { class: 'small' }, 'Rifai questa configurazione da Haul > Configurazione guidata...'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn primary', on: { click: reset } }, 'Inizia a usare Haul')));
}

// ── Variant C ──
function VariantC() {
  const st = steps(); const cur = st[S.step]; const last = S.step === st.length - 1;
  return h('div', { class: 'win vc' }, titlebar(''),
    h('div', { class: 'card' },
      h('div', { class: 'glyph', 'aria-hidden': 'true' }, GLYPH[cur.id]),
      h('h2', {}, LEAD[cur.id]),
      stepBody(cur.id, true),
      h('div', { class: 'actions' },
        S.step > 0 ? h('button', { class: 'btn', on: { click: () => go(-1) } }, 'Indietro') : null,
        cur.skip ? h('button', { class: 'btn', on: { click: () => go(1) } }, 'Non ora') : null,
        h('button', { class: 'btn primary', disabled: !canNext(), on: { click: () => last ? reset() : go(1) } }, last ? 'Apri Haul' : 'Continua')),
      h('div', { class: 'dots', 'aria-label': 'Passo ' + (S.step + 1) + ' di ' + st.length }, st.map((s, i) => h('i', { class: i === S.step ? 'on' : '' }))),
      h('p', { class: 'small', 'data-gdl-text': '' }, gdlText())),
    h('div', { class: 'gbar' }, h('i', { 'data-gdl-bar': '', style: 'width:' + S.gdl + '%' })));
}

function reset() { S.step = 0; S.path = null; S.gdl = 0; render(); }

// ── Switcher ──
function currentKey() { const m = /^#variante-([a-c])$/.exec(location.hash); return m ? m[1] : 'a'; }
function setKey(k) { location.hash = 'variante-' + k; }
function cycle(d) { const i = VARIANTS.findIndex(v => v.key === currentKey()); setKey(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key); }
document.getElementById('prev').addEventListener('click', () => cycle(-1));
document.getElementById('next').addEventListener('click', () => cycle(1));
document.addEventListener('keydown', e => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
window.addEventListener('hashchange', () => { S.step = 0; render(); });

function render() {
  const k = currentKey(); const v = VARIANTS.find(x => x.key === k);
  document.getElementById('vlabel').textContent = k.toUpperCase() + ' (' + v.name + ')';
  const stage = document.getElementById('stage');
  stage.replaceChildren(k === 'a' ? VariantA() : k === 'b' ? VariantB() : VariantC());
}
render();
</script>
